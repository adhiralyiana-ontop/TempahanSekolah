name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  milestone-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm test
        env:
          TEST_DEMO_CONTACT_EMAIL: demo@example.com
